[project]
name = "arxiv_retriever"
version = "1.4.0"
description = '"Automate your ArXiv paper search, retrieval, and summarization process."'
authors = [{ name = "Excel Chukwu", email = "excel.chukwu1.0@gmail.com" }]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "MIT"
keywords = [
    "arxiv",
    "cli",
    "research",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12.3",
    "requests>=2.32.3",
    "certifi>=2024.7.4",
    "charset-normalizer>=3.3.2",
    "click>=8.1.7",
    "idna>=3.7",
    "iniconfig>=2.0.0",
    "markdown-it-py>=3.0.0",
    "mdurl>=0.1.2",
    "packaging>=24.1",
    "pluggy>=1.5.0",
    "pygments>=2.18.0",
    "rich>=13.7.1",
    "shellingham>=1.5.4",
    "typing-extensions>=4.12.2",
    "urllib3>=2.2.2",
    "python-dotenv>=1.0.1,<2",
    "anthropic>=0.34.0,<1",
    "google-genai>=1.0.0",
    "trio>=0.26.0",
    "httpx>=0.27.0",
    "pypdf>=6.7.1",
]

[project.urls]
Repository = "https://github.com/MimicTester1307/arxiv_retriever"

[project.scripts]
axiv = "arxiv_retriever.cli:main"

[dependency-groups]
test = [
    "pytest>=8.2.2",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.8,<0.24",
]

[tool.uv]
default-groups = ["test"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
